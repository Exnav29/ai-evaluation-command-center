[project]
name = "aecc-foundation"
version = "0.1.0"
description = "AI Evaluation Command Center: evidence-based evaluation and qualification for AI engineering work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13",
  "fastapi>=0.110",
  "jinja2>=3.1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
